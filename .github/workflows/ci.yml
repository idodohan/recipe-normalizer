name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.7.x"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Import boundaries (import-linter)
        run: uv run lint-imports

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Export OpenAPI schema and check for drift
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code web/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Type-check
        run: npm run typecheck
        working-directory: web

      - name: Regenerate API client and check for drift
        run: |
          npm run generate:client
          git diff --exit-code src/api/schema.d.ts
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rn
          POSTGRES_USER: rn
          POSTGRES_PASSWORD: rn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RN_DATABASE_URL: postgresql+psycopg://rn:rn@localhost:5432/rn

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.7.x"

      - name: Install Python dependencies
        run: uv sync

      - name: Run DB migrations
        run: uv run alembic upgrade head

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        # webServer entries in playwright.config.ts boot both the backend
        # (uvicorn) and frontend (vite dev) before the suite runs.
        run: npx playwright test
        working-directory: e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
