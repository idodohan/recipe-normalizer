<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FEF9EE" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&family=Varela+Round&display=swap" rel="stylesheet">
    <title>Recipe Normalizer — Modern Culinary Studio</title>
    <script>
      var t = localStorage.getItem("rn-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    </script>
    <style>
      /* Pre-hydration backdrop so the paper tone shows before CSS loads. */
      html {
        background-color: #fef9ee;
      }
      html[data-theme="dark"] {
        background-color: #17130f;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background-color: #17130f;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
